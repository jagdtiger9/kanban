server {
	listen 80;
	root /var/www/kanban/public;
	server_name kanban.local;
	#disable_symlinks off;

	location / {
		return 301 https://kanban.local$request_uri;
	}
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
	root /var/www/kanban/public;
	index index.php index.html;
	server_name kanban.local;
	status_zone 'kanban';

    ssl_certificate /etc/nginx/ssl/kanban.local.crt;
    ssl_certificate_key /etc/nginx/ssl/kanban.local.key;

	error_page 404 /e404;
	client_max_body_size 300M;

	error_page 502 503 504 =503 @maintenance;

	location @maintenance {
		root /usr/share/nginx/html;
		try_files /maintenance.html =404;
		add_header Retry-After 3600;
		add_header Cache-Control "no-store";
	}

	location = / {
		try_files /build/index.html =404;
	}
	location /build/ {
		try_files $uri =404;
	}
	location /api {
		try_files $uri /index.php$is_args$query_string;
	}
	location /_ws_connection/ {
		resolver 127.0.0.11 valid=30s ipv6=off;
		set $centrifugo http://kanban-centrifugo:8000;
		rewrite ^/_ws_connection/(.*)$ /connection/$1 break;
		proxy_pass $centrifugo;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		proxy_buffering off;
	}
	location / {
		# SPA routes fall back to the built index.html
		try_files $uri /build/index.html;
	}
	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_pass php_fpm;
		include fastcgi_params;
		fastcgi_index index.php;
		fastcgi_split_path_info ^(.+\.php)(/.*)$;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param SCRIPT_NAME $fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_path_info;
	}
	location ~ /\.ht {
		deny all;
	}
	location = /favicon.ico {
		try_files /favicon.ico =204;
	}
    # Кэширование изображений и медиафайлов
    location ~* \.(jpg|jpeg|gif|png|ico|cur|gz|svg|mp4|ogg|ogv|webm|htc)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    # Кэширование CSS и JS
    location ~* \.(css|js|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
