grumphp:
    hooks_dir: ~
    hooks_preset: local
    git_hook_variables:
        EXEC_GRUMPHP_COMMAND: exec
        ENV: { }
    stop_on_failure: true
    ignore_unstaged_changes: false
    hide_circumvention_tip: true
    process_timeout: 120
    parallel:
        enabled: true
        max_workers: 32
    fixer:
        enabled: true
        fix_by_default: true
    environment:
        #        files:
        #            - .env
        variables: { }
        paths: [ ]
    tasks:
        phpcsfixer:
            allow_risky: ~
            cache_file: ~
            config: .php-cs-fixer.dist.php
            rules: [ ]
            using_cache: ~
            config_contains_finder: true
            verbose: true
            diff: false
            triggered_by: [ php ]
        phpunit:
            config_file: null
            testsuite: unit
            group: [ ]
            exclude_group: [ ]
            always_execute: false
            order: null
            coverage-clover: null
            coverage-html: null
            coverage-php: null
            coverage-xml: null
        phpstan:
            autoload_file: null
            configuration: null
            level: 3
            force_patterns: [ ]
            ignore_patterns: [ ]
            triggered_by: [ 'php' ]
            memory_limit: "1G"
            use_grumphp_paths: true
    testsuites: [ ]
    extensions: [ ]
